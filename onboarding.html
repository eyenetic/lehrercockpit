<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Einrichten – Lehrercockpit</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500&display=swap"
    />
    <link rel="stylesheet" href="./styles.css?v=92" />
    <link rel="stylesheet" href="./styles.auth.css?v=92" />
    <style>
      body.onboarding-page { align-items: flex-start; padding: 48px 16px; box-sizing: border-box; }
      .setup-card {
        background: var(--panel);
        border: 1px solid var(--line-strong);
        border-radius: var(--radius-lg);
        box-shadow: 0 4px 24px rgba(0, 0, 0, 0.12);
        width: 100%;
        max-width: 620px;
        margin: 0 auto;
        display: flex;
        flex-direction: column;
      }
      .setup-head { padding: 28px 32px 0; display: flex; flex-direction: column; gap: 6px; }
      .setup-head .eyebrow { margin: 0; font-size: 0.72rem; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--accent); }
      .setup-head h1 { margin: 0; font-size: 1.35rem; font-weight: 700; color: var(--ink); }
      .setup-head p { margin: 0; font-size: 0.88rem; color: var(--muted); line-height: 1.55; }
      .setup-steps { display: flex; gap: 4px; padding: 18px 32px 0; list-style: none; margin: 0; }
      .setup-steps li { flex: 1; display: flex; flex-direction: column; gap: 6px; font-size: 0.72rem; color: var(--muted); }
      .setup-steps li::before { content: ""; height: 4px; border-radius: 4px; background: var(--line-strong); }
      .setup-steps li.is-done::before { background: var(--success); }
      .setup-steps li.is-active::before { background: var(--accent); }
      .setup-steps li.is-active { color: var(--ink); font-weight: 600; }
      .setup-body { padding: 20px 32px 8px; min-height: 260px; }
      .setup-body > h2 { margin: 0 0 6px; font-size: 1.05rem; color: var(--ink); }
      .setup-body > p.lead, .setup-body p.lead { margin: 0 0 14px; font-size: 0.86rem; color: var(--muted); line-height: 1.55; }
      .setup-body .connection-section:first-child { border-top: 0; padding-top: 4px; }
      .setup-list { list-style: none; margin: 0 0 16px; padding: 0; display: flex; flex-direction: column; gap: 8px; }
      .setup-list li { display: flex; gap: 10px; align-items: flex-start; font-size: 0.86rem; color: var(--ink); line-height: 1.45; }
      .setup-list li span.dot { width: 8px; height: 8px; border-radius: 50%; margin-top: 6px; flex-shrink: 0; background: var(--line-strong); }
      .setup-list li span.dot.is-ok { background: var(--success); }
      .setup-list li span.dot.is-warn { background: var(--warning); }
      .setup-list li small { display: block; color: var(--muted); font-size: 0.78rem; }
      .setup-box { padding: 12px 14px; border: 1px solid var(--line); border-radius: var(--radius-md); background: var(--panel-soft); margin-bottom: 14px; }
      .setup-box h3 { margin: 0 0 8px; font-size: 0.8rem; color: var(--ink); }
      .setup-box .setup-list { margin: 0; }
      .setup-actions {
        display: flex;
        flex-direction: row;
        align-items: center;
        gap: 10px;
        padding: 16px 32px 24px;
        border-top: 1px solid var(--line);
        margin-top: 8px;
      }
      .setup-actions .spacer { flex: 1; }
      .setup-actions .hint { font-size: 0.78rem; color: var(--muted); }
      .setup-feedback { font-size: 0.82rem; color: var(--danger); margin: 0 32px; min-height: 1em; }
      @media (max-width: 560px) {
        body.onboarding-page { padding: 16px 12px; }
        .setup-head, .setup-steps, .setup-body, .setup-actions { padding-left: 18px; padding-right: 18px; }
        .setup-steps li { font-size: 0; }
        .setup-actions .hint { display: none; }
      }
    </style>
  </head>
  <body class="onboarding-page">
    <main class="setup-card">
      <div class="setup-head">
        <p class="eyebrow">Einrichtung</p>
        <h1 id="setup-title">Willkommen im Lehrercockpit</h1>
        <p id="setup-subtitle">In wenigen Schritten verbindest du deine Quellen. Jeder Schritt lässt sich überspringen und später unter „Verbindungen“ nachholen.</p>
      </div>
      <ol class="setup-steps" id="setup-steps"></ol>
      <section class="setup-body" id="setup-body" aria-live="polite"></section>
      <p class="setup-feedback" id="setup-feedback"></p>
      <div class="setup-actions">
        <button class="btn btn-secondary" type="button" id="setup-back">Zurück</button>
        <span class="spacer"></span>
        <span class="hint" id="setup-hint"></span>
        <button class="btn btn-primary" type="button" id="setup-next">Los geht’s</button>
      </div>
    </main>

    <script>
      // Lokal (localhost) spricht die Seite mit dem lokalen Backend, sonst mit der Produktion.
      window.BACKEND_API_URL = ["localhost", "127.0.0.1"].includes(window.location.hostname)
        ? window.location.origin
        : "https://api.lehrercockpit.com";
      window.MULTIUSER_ENABLED = true;
    </script>
    <script src="./src/features/push.js?v=92"></script>
    <script src="./src/features/connections.js?v=92"></script>
    <script>
      (function () {
        'use strict';

        var BACKEND = window.BACKEND_API_URL || '';
        var C = window.LehrerConnections;
        var STEPS = [
          { id: 'welcome', label: 'Start' },
          { id: 'webuntis', label: 'Stundenplan', title: 'Stundenplan verbinden',
            lead: 'Mit dem Kalender-Abo aus WebUntis siehst du deine Stunden, Vertretungen und Entfälle – auch als Hinweis am Morgen.' },
          { id: 'itslearning', label: 'itslearning', title: 'itslearning verbinden',
            lead: 'Termine und Abgabefristen deiner Kurse. Das Kalender-Abo funktioniert ohne Passwort.' },
          { id: 'nextcloud', label: 'Nextcloud', title: 'Nextcloud verbinden (optional)',
            lead: 'Deine Nextcloud-Favoriten erscheinen dann unter „Links“ – jede wichtige Datei mit einem Klick.' },
          { id: 'push', label: 'Hinweise', title: 'Hinweise aufs Handy (optional)',
            lead: 'Schultags morgens dein Tag in drei Zeilen, sonntags die Vorschau auf die Woche – direkt als Mitteilung.' },
          { id: 'done', label: 'Fertig' },
        ];
        var PERSONAL = { webuntis: 'Stundenplan (WebUntis)', itslearning: 'itslearning', nextcloud: 'Nextcloud' };
        var current = 0;
        var status = {};
        var user = null;

        function esc(value) { return C.esc(value); }
        function el(id) { return document.getElementById(id); }

        function connected(id) {
          var s = status[id] || {};
          if (id === 'webuntis') return !!s.configured;
          if (id === 'itslearning') return !!(s.calendar || s.login);
          if (id === 'nextcloud') return !!s.connected;
          return false;
        }

        function schoolItems() {
          if (!status.orgaplan && !status.termine && !status.klassenarbeitsplan) return null; // not loaded yet
          var o = status.orgaplan || {};
          var cw = status.klassenarbeitsplan || {};
          var plan = cw.plan || {};
          var t = status.termine || {};
          return [
            {
              ok: o.status === 'ok',
              title: 'Orgaplan',
              text: o.status === 'ok'
                ? 'Aktuell' + (o.school_year ? ' (Schuljahr ' + o.school_year + (o.stand ? ', Stand ' + o.stand : '') + ')' : '') + ' – wird automatisch von der Schulwebseite übernommen.'
                : (o.detail || 'Wird eingerichtet.'),
            },
            {
              ok: plan.state === 'ok',
              title: 'Klassenarbeitsplan',
              text: plan.state === 'ok' ? 'Verbunden – du siehst die kommenden Arbeiten deiner Klassen.'
                : plan.state === 'outdated' ? 'Der hinterlegte Plan ist veraltet – die Schule muss den aktuellen Link eintragen.'
                : cw.url ? 'Wird geladen.' : 'Noch nicht hinterlegt – du kannst die Excel-Datei später selbst hochladen.',
            },
            { ok: !!t.ok, title: 'Schultermine', text: t.ok ? 'Kalender der Schulwebseite – Ferien, Fahrten und Konferenzen.' : 'Gerade nicht erreichbar.' },
            { ok: true, title: 'Dienstmail', text: 'Direktlink zu deinem Postfach (Anmeldung über das Schulportal).' },
          ];
        }

        function listHtml(items) {
          if (!items) return '<p class="lead">Der Stand wird geladen …</p>';
          return '<ul class="setup-list">' + items.map(function (item) {
            return '<li><span class="dot ' + (item.ok ? 'is-ok' : 'is-warn') + '"></span><span><strong>' + esc(item.title) + '</strong>' +
              '<small>' + esc(item.text) + '</small></span></li>';
          }).join('') + '</ul>';
        }

        function renderSteps() {
          el('setup-steps').innerHTML = STEPS.map(function (step, index) {
            var cls = index < current ? 'is-done' : index === current ? 'is-active' : '';
            return '<li class="' + cls + '">' + esc(step.label) + '</li>';
          }).join('');
        }

        function updateFooter() {
          var step = STEPS[current];
          var next = el('setup-next');
          var hint = el('setup-hint');
          el('setup-back').hidden = current === 0;
          hint.textContent = '';
          var skipping = step.id !== 'welcome' && step.id !== 'done' && !connected(step.id);
          next.className = 'btn ' + (skipping ? 'btn-secondary' : 'btn-primary');
          if (step.id === 'welcome') next.textContent = 'Los geht’s';
          else if (step.id === 'done') next.textContent = 'Cockpit öffnen';
          else if (!skipping) next.textContent = 'Weiter';
          else {
            next.textContent = 'Überspringen';
            hint.textContent = 'Später unter „Verbindungen“ möglich.';
          }
        }

        function render() {
          var step = STEPS[current];
          var body = el('setup-body');
          el('setup-feedback').textContent = '';
          renderSteps();

          if (step.id === 'welcome') {
            var name = (user && (user.first_name || user.full_name)) || '';
            el('setup-title').textContent = 'Willkommen' + (name ? ', ' + name : '') + '!';
            body.innerHTML =
              '<p class="lead">Das Lehrercockpit bündelt deinen Schulalltag auf einer Seite: Stundenplan, Orgaplan, Klassenarbeiten, Schultermine, itslearning und Nextcloud.</p>' +
              '<div class="setup-box"><h3>Das hat deine Schule schon eingerichtet</h3>' + listHtml(schoolItems()) + '</div>' +
              '<p class="lead">Jetzt fehlen nur noch deine persönlichen Zugänge – das dauert etwa drei Minuten.</p>';
            updateFooter();
            return;
          }
          el('setup-title').textContent = step.id === 'done' ? 'Alles bereit' : 'Einrichtung';

          if (step.id === 'done') {
            var items = Object.keys(PERSONAL).map(function (id) {
              return { ok: connected(id), title: PERSONAL[id],
                       text: connected(id) ? 'Verbunden.' : 'Nicht verbunden – jederzeit unter „Verbindungen“ nachholen.' };
            });
            body.innerHTML = '<p class="lead">Dein Cockpit ist startklar. Alle Quellen findest du später unter „Verbindungen“ – dort siehst du auch, wie aktuell jede Quelle ist.</p>' +
              '<div class="setup-box"><h3>Deine Zugänge</h3>' + listHtml(items) + '</div>' +
              '<div class="setup-box"><h3>Schulweite Quellen</h3>' + listHtml(schoolItems()) + '</div>';
            updateFooter();
            return;
          }

          body.innerHTML = '<h2>' + esc(step.title) + '</h2><p class="lead">' + esc(step.lead) + '</p><div id="setup-section"></div>';
          C.mount(el('setup-section'), {
            sections: [step.id],
            onChanged: function () { refreshStatus().then(updateFooter); },
          });
          updateFooter();
        }

        function refreshStatus(attempt) {
          attempt = attempt || 0;
          return C.api('/api/v2/connections')
            .then(function (data) { status = data.connections || {}; })
            .catch(function (err) {
              // A new account's first request can race the server's start-up work: try again shortly.
              if (attempt >= 3) throw err;
              return new Promise(function (resolve) { setTimeout(resolve, 1500 * (attempt + 1)); })
                .then(function () { return refreshStatus(attempt + 1); });
            });
        }

        function finish() {
          el('setup-next').disabled = true;
          fetch(BACKEND + '/api/v2/dashboard/onboarding/complete', { method: 'POST', credentials: 'include' })
            .catch(function () { /* the dashboard also works without the flag */ })
            .then(function () { window.location.href = './index.html'; });
        }

        el('setup-next').addEventListener('click', function () {
          if (STEPS[current].id === 'done') { finish(); return; }
          current = Math.min(current + 1, STEPS.length - 1);
          render();
        });
        el('setup-back').addEventListener('click', function () {
          current = Math.max(current - 1, 0);
          render();
        });

        fetch(BACKEND + '/api/v2/auth/me', { credentials: 'include' })
          .then(function (resp) {
            if (!resp.ok) throw new Error('login');
            return resp.json();
          })
          .then(function (data) {
            if (!data.ok) throw new Error('login');
            user = data.user;
          })
          .then(function () {
            render();
            refreshStatus()
              .then(function () {
                var step = STEPS[current].id;
                if (step === 'welcome' || step === 'done') render();
                else updateFooter();
              })
              .catch(function () {
                el('setup-feedback').textContent = 'Der Stand der Quellen konnte gerade nicht geladen werden – das Einrichten klappt trotzdem.';
              });
          }, function () { window.location.href = './login.html'; });
      })();
    </script>
  </body>
</html>
